<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PediFlash - Inicio de Sesión</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #004E89;
            --accent: #1A936F;
            --danger: #DC3545;
            --light: #F8F9FA;
            --dark: #212529;
            --gray: #6C757D;
            --border: #DEE2E6;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #FFF5F0 0%, #F0F7FF 50%, #F0FFF8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .background-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 107, 53, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 78, 137, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(26, 147, 111, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: white;
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.3);
            margin-bottom: 15px;
        }

        .app-name {
            font-size: 32px;
            font-weight: 800;
            color: var(--dark);
            letter-spacing: -1px;
        }

        .app-name span {
            color: var(--primary);
        }

        .app-slogan {
            font-size: 14px;
            color: var(--gray);
            margin-top: -2px;
        }

        .card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 35px 30px;
            border: 1px solid var(--border);
        }

        .tabs {
            display: flex;
            background: #F1F3F5;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 30px;
            position: relative;
        }

        .tab {
            flex: 1;
            padding: 12px 20px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            color: var(--gray);
            border: none;
            background: transparent;
        }

        .tab.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #FAFBFC;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
        }

        .form-group input::placeholder {
            color: #ADB5BD;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--gray);
            font-size: 18px;
            padding: 5px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            margin-top: 12px;
        }

        .btn-outline:hover {
            background: rgba(255, 107, 53, 0.05);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: var(--gray);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider span {
            padding: 0 15px;
        }

        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .alert-error {
            background: #FFF5F5;
            color: var(--danger);
            border: 1px solid #FFC9C9;
        }

        .alert-success {
            background: #F0FFF8;
            color: var(--accent);
            border: 1px solid #B7E4CF;
        }

        .alert-warning {
            background: #FFF8E1;
            color: #F57F17;
            border: 1px solid #FFE082;
        }

        .forgot-password {
            text-align: right;
            margin-top: -12px;
            margin-bottom: 15px;
        }

        .forgot-password a {
            color: var(--secondary);
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .repartidor-extra {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .repartidor-extra.show {
            display: block;
        }

        /* Estilos para código de afiliado */
        .afiliado-field {
            background: linear-gradient(135deg, #F8FFF8 0%, #F0FFF4 100%);
            border: 2px dashed var(--accent);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .afiliado-field:hover {
            border-color: #147D5F;
            background: linear-gradient(135deg, #F0FFF4 0%, #E8FFF0 100%);
        }

        .afiliado-field .afiliado-icon {
            font-size: 20px;
            margin-right: 8px;
        }

        .afiliado-field .afiliado-hint {
            font-size: 12px;
            color: var(--gray);
            margin-top: 6px;
            font-style: italic;
        }

        .afiliado-field input {
            border-color: #B7E4CF;
            background: white;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
        }

        .afiliado-field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(26, 147, 111, 0.1);
        }

        .afiliado-field input::placeholder {
            letter-spacing: 2px;
            font-size: 14px;
            font-weight: 400;
            color: #ADB5BD;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .afiliado-validando {
            animation: pulse 1s infinite;
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
        }

        .afiliado-exito {
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
        }

        .file-input-wrapper input[type="file"] {
            padding: 12px;
            border: 2px dashed var(--border);
            background: #FAFBFC;
            cursor: pointer;
            font-size: 14px;
        }

        .file-input-wrapper input[type="file"]:hover {
            border-color: var(--primary);
            background: #FFF5F0;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        @media (max-width: 500px) {
            .card {
                padding: 25px 20px;
            }
            .logo {
                width: 70px;
                height: 70px;
                font-size: 32px;
            }
            .app-name {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <div class="background-pattern"></div>

    <div class="container">
        <!-- Logo -->
        <div class="logo-container">
            <div class="logo">🛵</div>
            <h1 class="app-name">Pedi<span>Flash</span></h1>
            <p class="app-slogan">Entregas rápidas y seguras</p>
        </div>

        <!-- Card principal -->
        <div class="card">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" id="tabLogin">Iniciar Sesión</button>
                <button class="tab" id="tabRegister">Registrarse</button>
            </div>

            <!-- Alertas -->
            <div class="alert alert-error" id="alertError"></div>
            <div class="alert alert-success" id="alertSuccess"></div>
            <div class="alert alert-warning" id="alertWarning"></div>

            <!-- ==================== FORMULARIO DE LOGIN ==================== -->
            <form id="formLogin">
                <div class="form-group">
                    <label>📧 Correo electrónico</label>
                    <input type="email" id="loginEmail" placeholder="tu@correo.com" required>
                </div>

                <div class="form-group">
                    <label>🔒 Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="loginPassword" placeholder="Tu contraseña" required>
                        <button type="button" class="toggle-password" data-target="loginPassword">👁️</button>
                    </div>
                </div>

                <div class="forgot-password">
                    <a id="btnForgotPassword">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primary" id="btnLoginSubmit">
                    Iniciar Sesión
                </button>

                <div class="divider">
                    <span>o</span>
                </div>

                <button type="button" class="btn btn-outline" id="btnGoToRegister">
                    Crear una cuenta nueva
                </button>
            </form>

            <!-- ==================== FORMULARIO DE REGISTRO ==================== -->
            <form id="formRegister" style="display: none;">
                <div class="form-group">
                    <label>👤 Nombre completo</label>
                    <input type="text" id="regNombre" placeholder="Tu nombre completo" required>
                </div>

                <div class="form-group">
                    <label>📱 Teléfono</label>
                    <input type="tel" id="regTelefono" placeholder="10 dígitos" required pattern="[0-9]{10}" maxlength="10">
                </div>

                <div class="form-group">
                    <label>📧 Correo electrónico</label>
                    <input type="email" id="regEmail" placeholder="tu@correo.com" required>
                </div>

                <div class="form-group">
                    <label>🔒 Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                        <button type="button" class="toggle-password" data-target="regPassword">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Tipo de cuenta</label>
                    <select id="regTipoCuenta" required>
                        <option value="cliente">🧑 Cliente - Quiero enviar paquetes</option>
                        <option value="repartidor">🛵 Repartidor - Quiero hacer entregas</option>
                    </select>
                </div>

                <!-- ========== CAMPO DE CÓDIGO DE AFILIADO ========== -->
                <div class="afiliado-field" id="afiliadoField">
                    <label>
                        <span class="afiliado-icon">🎁</span> Código de Afiliado (opcional)
                    </label>
                    <input 
                        type="text" 
                        id="regCodigoAfiliado" 
                        placeholder="Ej: 123456" 
                        maxlength="6" 
                        minlength="6"
                        pattern="[0-9]{6}"
                        inputmode="numeric"
                        autocomplete="off"
                    >
                    <p class="afiliado-hint">💡 Si tienes un código de afiliado, ingrésalo aquí para ganar puntos</p>
                    <p id="afiliadoStatus" style="font-size: 12px; margin-top: 6px; display: none;"></p>
                </div>

                <!-- Campos extras para repartidor -->
                <div class="repartidor-extra" id="repartidorExtraFields">
                    <div class="form-group">
                        <label>📸 Foto de tu credencial/identificación</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="regCredencial" accept="image/*">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>🤳 Foto de tu rostro (selfie)</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="regFotoRostro" accept="image/*">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="btnRegisterSubmit">
                    Crear Cuenta
                </button>

                <div class="divider">
                    <span>o</span>
                </div>

                <button type="button" class="btn btn-outline" id="btnGoToLogin">
                    Ya tengo una cuenta
                </button>
            </form>

            <!-- ==================== FORMULARIO DE RECUPERACIÓN ==================== -->
            <form id="formRecovery" style="display: none;">
                <h3 style="text-align: center; margin-bottom: 8px; color: var(--dark);">🔑 Recuperar Contraseña</h3>
                <p style="text-align: center; font-size: 14px; color: var(--gray); margin-bottom: 25px;">
                    Te enviaremos un enlace para restablecer tu contraseña
                </p>

                <div class="form-group">
                    <label>📧 Correo electrónico</label>
                    <input type="email" id="recoveryEmail" placeholder="tu@correo.com" required>
                </div>

                <button type="submit" class="btn btn-primary" id="btnRecoverySubmit">
                    Enviar enlace de recuperación
                </button>

                <div class="divider">
                    <span>o</span>
                </div>

                <button type="button" class="btn btn-outline" id="btnBackToLogin">
                    Volver al inicio de sesión
                </button>
            </form>
        </div>
    </div>

    <script>
        // =============================================
        // CONFIGURACIÓN DE SUPABASE
        // =============================================
        const SUPABASE_URL = 'https://kjbesbtvgmtuffgmzaaw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_xbe-EzT66Ww36li0dM9iVw_5zHWyBTZ';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // =============================================
        // ELEMENTOS DEL DOM
        // =============================================
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const formLogin = document.getElementById('formLogin');
        const formRegister = document.getElementById('formRegister');
        const formRecovery = document.getElementById('formRecovery');
        const alertError = document.getElementById('alertError');
        const alertSuccess = document.getElementById('alertSuccess');
        const alertWarning = document.getElementById('alertWarning');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const btnLoginSubmit = document.getElementById('btnLoginSubmit');
        const regNombre = document.getElementById('regNombre');
        const regTelefono = document.getElementById('regTelefono');
        const regEmail = document.getElementById('regEmail');
        const regPassword = document.getElementById('regPassword');
        const regTipoCuenta = document.getElementById('regTipoCuenta');
        const regCredencial = document.getElementById('regCredencial');
        const regFotoRostro = document.getElementById('regFotoRostro');
        const btnRegisterSubmit = document.getElementById('btnRegisterSubmit');
        const repartidorExtraFields = document.getElementById('repartidorExtraFields');
        const regCodigoAfiliado = document.getElementById('regCodigoAfiliado');
        const afiliadoStatus = document.getElementById('afiliadoStatus');
        const recoveryEmail = document.getElementById('recoveryEmail');
        const btnRecoverySubmit = document.getElementById('btnRecoverySubmit');
        const btnGoToRegister = document.getElementById('btnGoToRegister');
        const btnGoToLogin = document.getElementById('btnGoToLogin');
        const btnForgotPassword = document.getElementById('btnForgotPassword');
        const btnBackToLogin = document.getElementById('btnBackToLogin');

        // =============================================
        // FUNCIONES AUXILIARES
        // =============================================
        function showAlert(type, message) {
            alertError.style.display = 'none';
            alertSuccess.style.display = 'none';
            alertWarning.style.display = 'none';

            if (type === 'error') {
                alertError.textContent = message;
                alertError.style.display = 'block';
            } else if (type === 'success') {
                alertSuccess.textContent = message;
                alertSuccess.style.display = 'block';
            } else if (type === 'warning') {
                alertWarning.textContent = message;
                alertWarning.style.display = 'block';
            }
        }

        function hideAlerts() {
            alertError.style.display = 'none';
            alertSuccess.style.display = 'none';
            alertWarning.style.display = 'none';
        }

        function setLoading(button, isLoading) {
            if (isLoading) {
                button.disabled = true;
                button.innerHTML = '<span class="spinner"></span> Procesando...';
            } else {
                button.disabled = false;
                button.innerHTML = button.getAttribute('data-original-text') || button.textContent;
            }
        }

        [btnLoginSubmit, btnRegisterSubmit, btnRecoverySubmit].forEach(btn => {
            btn.setAttribute('data-original-text', btn.textContent.trim());
        });

        function showForm(formToShow) {
            formLogin.style.display = 'none';
            formRegister.style.display = 'none';
            formRecovery.style.display = 'none';
            formToShow.style.display = 'block';
            hideAlerts();
        }

        // Toggle password visibility
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (input.type === 'password') {
                    input.type = 'text';
                    this.textContent = '🙈';
                } else {
                    input.type = 'password';
                    this.textContent = '👁️';
                }
            });
        });

        // Mostrar/ocultar campos de repartidor
        regTipoCuenta.addEventListener('change', function() {
            if (this.value === 'repartidor') {
                repartidorExtraFields.classList.add('show');
                regCredencial.required = true;
                regFotoRostro.required = true;
            } else {
                repartidorExtraFields.classList.remove('show');
                regCredencial.required = false;
                regFotoRostro.required = false;
            }
        });

        // =============================================
        // NUEVO: Validación en tiempo real del código de afiliado
        // (Usando RPC para evitar problemas de RLS)
        // =============================================
        regCodigoAfiliado.addEventListener('input', function() {
            // Solo permitir números
            this.value = this.value.replace(/[^0-9]/g, '');
            
            // Limpiar estado
            afiliadoStatus.style.display = 'none';
            afiliadoStatus.className = '';
            
            // Si está completo (6 dígitos), verificar si existe
            if (this.value.length === 6) {
                afiliadoStatus.style.display = 'block';
                afiliadoStatus.textContent = '⏳ Verificando código...';
                afiliadoStatus.className = 'afiliado-validando';
                
                // Verificar código usando RPC (bypassea RLS)
                verificarCodigoAfiliado(this.value);
            }
        });

        /**
         * Verifica si un código de afiliado es válido y está disponible.
         * 
         * CAMBIO IMPORTANTE: Ahora usa una consulta a la tabla 'afiliados'
         * pero como el usuario no está autenticado aún, podría fallar por RLS.
         * 
         * SOLUCIÓN: Creamos una función RPC en PostgreSQL que verifique
         * el código sin restricciones de RLS (SECURITY DEFINER).
         * 
         * Si no puedes crear la función RPC, simplemente intentamos la consulta
         * directa y manejamos el error de RLS como "no verificado".
         */
        async function verificarCodigoAfiliado(codigo) {
            try {
                // INTENTO 1: Usar función RPC (recomendado, bypassea RLS)
                // Debes crear esta función en PostgreSQL:
                // CREATE OR REPLACE FUNCTION verificar_codigo_afiliado_publico(p_codigo VARCHAR)
                // RETURNS JSONB AS $$
                // DECLARE v_afiliado RECORD;
                // BEGIN
                //     SELECT codigo, nombre, usuario_id INTO v_afiliado
                //     FROM afiliados WHERE codigo = p_codigo AND activo = true;
                //     IF NOT FOUND THEN RETURN jsonb_build_object('valido', false, 'mensaje', 'Código no encontrado');
                //     ELSIF v_afiliado.usuario_id IS NOT NULL THEN RETURN jsonb_build_object('valido', false, 'en_uso', true, 'mensaje', 'Código ya en uso');
                //     ELSE RETURN jsonb_build_object('valido', true, 'nombre', v_afiliado.nombre);
                //     END IF;
                // END; $$ LANGUAGE plpgsql SECURITY DEFINER;
                
                let resultado;
                
                try {
                    // Intentar usar la función RPC primero
                    const { data, error } = await supabaseClient
                        .rpc('verificar_codigo_afiliado_publico', {
                            p_codigo: codigo
                        });
                    
                    if (!error && data) {
                        resultado = data;
                    } else {
                        throw new Error('RPC no disponible');
                    }
                } catch (rpcError) {
                    // INTENTO 2: Consulta directa (puede fallar por RLS)
                    console.warn('⚠️ RPC no disponible, intentando consulta directa...');
                    const { data, error } = await supabaseClient
                        .from('afiliados')
                        .select('codigo, nombre, usuario_id')
                        .eq('codigo', codigo)
                        .eq('activo', true)
                        .maybeSingle();
                    
                    if (error) {
                        // Error de RLS esperado - el usuario no está autenticado
                        if (error.code === '42501' || error.message?.includes('policy')) {
                            afiliadoStatus.style.display = 'block';
                            afiliadoStatus.textContent = 'ℹ️ El código se validará al registrarte';
                            afiliadoStatus.className = '';
                            afiliadoStatus.style.color = '#6C757D';
                            return { valido: null, pendiente: true };
                        }
                        throw error;
                    }
                    
                    resultado = data 
                        ? { 
                            valido: !data.usuario_id, 
                            en_uso: !!data.usuario_id,
                            nombre: data.nombre,
                            mensaje: data.usuario_id ? 'Código ya en uso' : 'Código válido'
                          }
                        : { valido: false, mensaje: 'Código no encontrado' };
                }
                
                // Procesar resultado
                if (!resultado || !resultado.valido) {
                    if (resultado?.en_uso) {
                        afiliadoStatus.style.display = 'block';
                        afiliadoStatus.textContent = '⚠️ Este código ya está en uso por otra persona';
                        afiliadoStatus.className = '';
                        afiliadoStatus.style.color = '#DC3545';
                    } else {
                        afiliadoStatus.style.display = 'block';
                        afiliadoStatus.textContent = '⚠️ Código no encontrado. Puedes registrarte sin él.';
                        afiliadoStatus.className = '';
                        afiliadoStatus.style.color = '#F57F17';
                    }
                    return { valido: false };
                }
                
                // Código válido y disponible
                afiliadoStatus.style.display = 'block';
                afiliadoStatus.textContent = '✅ Código válido - Afiliado: ' + (resultado.nombre || 'Desconocido');
                afiliadoStatus.className = 'afiliado-exito';
                afiliadoStatus.style.color = '#1A936F';
                return { valido: true, afiliado: resultado };

            } catch (err) {
                console.error('Error verificando código:', err);
                // Error inesperado - mostramos mensaje genérico
                afiliadoStatus.style.display = 'block';
                afiliadoStatus.textContent = 'ℹ️ No se pudo verificar. Se intentará al registrarte.';
                afiliadoStatus.className = '';
                afiliadoStatus.style.color = '#6C757D';
                return { valido: null, pendiente: true };
            }
        }

        // =============================================
        // NAVEGACIÓN ENTRE FORMULARIOS
        // =============================================
        tabLogin.addEventListener('click', function() {
            this.classList.add('active');
            tabRegister.classList.remove('active');
            showForm(formLogin);
            formRecovery.style.display = 'none';
        });

        tabRegister.addEventListener('click', function() {
            this.classList.add('active');
            tabLogin.classList.remove('active');
            showForm(formRegister);
            formRecovery.style.display = 'none';
        });

        btnGoToRegister.addEventListener('click', function() {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            showForm(formRegister);
        });

        btnGoToLogin.addEventListener('click', function() {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            showForm(formLogin);
        });

        btnForgotPassword.addEventListener('click', function(e) {
            e.preventDefault();
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            formLogin.style.display = 'none';
            formRegister.style.display = 'none';
            formRecovery.style.display = 'block';
            recoveryEmail.value = loginEmail.value || '';
            hideAlerts();
        });

        btnBackToLogin.addEventListener('click', function() {
            formRecovery.style.display = 'none';
            formLogin.style.display = 'block';
            hideAlerts();
        });

        // =============================================
        // SUBIR ARCHIVO A SUPABASE STORAGE
        // =============================================
        async function uploadFile(file, bucket, folder) {
            const fileName = `${folder}/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
            const { data, error } = await supabaseClient.storage
                .from(bucket)
                .upload(fileName, file, {
                    cacheControl: '3600',
                    upsert: false
                });

            if (error) {
                console.error('Error al subir archivo:', error);
                throw new Error('Error al subir archivo: ' + error.message);
            }

            const { data: urlData } = supabaseClient.storage
                .from(bucket)
                .getPublicUrl(data.path);

            return urlData.publicUrl;
        }

        // =============================================
        // VINCULAR CÓDIGO DE AFILIADO (después del registro)
        // =============================================
        async function vincularAfiliado(codigo) {
            try {
                const { data, error } = await supabaseClient
                    .rpc('vincular_codigo_afiliado', {
                        p_codigo: codigo
                    });

                if (error) {
                    console.error('Error al vincular afiliado:', error);
                    return { success: false, error: error.message };
                }

                return data;
            } catch (err) {
                console.error('Error inesperado:', err);
                return { success: false, error: err.message };
            }
        }

        // =============================================
        // REGISTRO DE USUARIO
        // =============================================
        formRegister.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlerts();

            const tipoCuenta = regTipoCuenta.value;
            const codigoAfiliado = regCodigoAfiliado.value.trim();

            // Validar campos de repartidor
            if (tipoCuenta === 'repartidor') {
                if (!regCredencial.files[0]) {
                    showAlert('error', 'Debes subir una foto de tu credencial/identificación');
                    return;
                }
                if (!regFotoRostro.files[0]) {
                    showAlert('error', 'Debes subir una foto de tu rostro (selfie)');
                    return;
                }
            }

            // Validar código de afiliado si se ingresó
            if (codigoAfiliado.length > 0 && codigoAfiliado.length !== 6) {
                showAlert('warning', 'El código de afiliado debe tener exactamente 6 dígitos');
                return;
            }

            setLoading(btnRegisterSubmit, true);

            try {
                // 1. Crear usuario en Auth de Supabase
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: regEmail.value.trim(),
                    password: regPassword.value,
                    options: {
                        data: {
                            nombre: regNombre.value.trim(),
                            telefono: regTelefono.value.trim(),
                            rol: tipoCuenta
                        }
                    }
                });

                if (authError) {
                    throw new Error(authError.message);
                }

                if (!authData.user) {
                    throw new Error('No se pudo crear el usuario');
                }

                const userId = authData.user.id;

                // 2. Crear perfil en la tabla perfiles
                let credencialUrl = null;
                let fotoRostroUrl = null;

                // Subir archivos si es repartidor
                if (tipoCuenta === 'repartidor') {
                    try {
                        credencialUrl = await uploadFile(regCredencial.files[0], 'documentos', 'credenciales');
                        fotoRostroUrl = await uploadFile(regFotoRostro.files[0], 'documentos', 'rostros');
                    } catch (uploadError) {
                        console.error('Error subiendo archivos:', uploadError);
                        // Continuamos aunque falle la subida
                    }
                }

                // Insertar perfil
                const { error: profileError } = await supabaseClient
                    .from('perfiles')
                    .insert({
                        user_id: userId,
                        nombre: regNombre.value.trim(),
                        telefono: regTelefono.value.trim(),
                        rol: tipoCuenta,
                        email: regEmail.value.trim(),
                        credencial_url: credencialUrl,
                        foto_rostro_url: fotoRostroUrl,
                        activo: true,
                        suspendido: false
                    });

                if (profileError) {
                    console.error('Error al crear perfil:', profileError);
                    showAlert('error', 'Error al crear perfil: ' + profileError.message);
                    setLoading(btnRegisterSubmit, false);
                    return;
                }

                // 3. Vincular código de afiliado si se ingresó
                let afiliadoMensaje = '';
                if (codigoAfiliado.length === 6) {
                    // Necesitamos iniciar sesión primero para usar la función RPC
                    // porque requiere autenticación
                    const { data: signInData, error: signInError } = await supabaseClient.auth.signInWithPassword({
                        email: regEmail.value.trim(),
                        password: regPassword.value
                    });
                    
                    if (!signInError && signInData.user) {
                        const resultado = await vincularAfiliado(codigoAfiliado);
                        
                        if (resultado && resultado.success) {
                            afiliadoMensaje = ' 🎁 ¡Código de afiliado vinculado exitosamente!';
                            console.log('✅ Afiliado vinculado:', resultado);
                        } else {
                            const errorMsg = resultado?.error || 'Código de afiliado no válido';
                            console.warn('⚠️ No se pudo vincular afiliado:', errorMsg);
                            afiliadoMensaje = ' ⚠️ El código de afiliado no se pudo vincular: ' + errorMsg;
                        }
                        
                        // Cerrar sesión para que el usuario confirme su email primero
                        await supabaseClient.auth.signOut();
                    } else {
                        afiliadoMensaje = ' ⚠️ El código se vinculará cuando confirmes tu email.';
                    }
                }

                showAlert('success', '✅ ¡Cuenta creada exitosamente!' + afiliadoMensaje + ' Revisa tu correo para confirmar tu cuenta.');

                // Limpiar formulario
                formRegister.reset();
                repartidorExtraFields.classList.remove('show');
                afiliadoStatus.style.display = 'none';

                // Redirigir al login después de 2 segundos
                setTimeout(() => {
                    tabLogin.click();
                    loginEmail.value = regEmail.value.trim();
                }, 2500);

            } catch (error) {
                console.error('Error en registro:', error);
                showAlert('error', '❌ ' + error.message);
            } finally {
                setLoading(btnRegisterSubmit, false);
            }
        });

        // =============================================
        // INICIO DE SESIÓN
        // =============================================
        formLogin.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlerts();

            setLoading(btnLoginSubmit, true);

            try {
                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                    email: loginEmail.value.trim(),
                    password: loginPassword.value
                });

                if (authError) {
                    throw new Error(authError.message);
                }

                if (!authData.user) {
                    throw new Error('Usuario no encontrado');
                }

                const { data: profile, error: profileError } = await supabaseClient
                    .from('perfiles')
                    .select('rol, activo, suspendido')
                    .eq('user_id', authData.user.id)
                    .single();

                if (profileError || !profile) {
                    throw new Error('Perfil no encontrado. Contacta al administrador.');
                }

                if (!profile.activo) {
                    await supabaseClient.auth.signOut();
                    throw new Error('Tu cuenta está desactivada. Contacta al administrador.');
                }

                if (profile.suspendido) {
                    await supabaseClient.auth.signOut();
                    throw new Error('Tu cuenta está suspendida. Contacta al administrador.');
                }

                showAlert('success', '✅ ¡Inicio de sesión exitoso! Redirigiendo...');

                setTimeout(() => {
                    switch (profile.rol) {
                        case 'admin':
                            window.location.href = 'admin.html';
                            break;
                        case 'repartidor':
                            window.location.href = 'repartidor.html';
                            break;
                        case 'cliente':
                        default:
                            window.location.href = 'cliente.html';
                            break;
                    }
                }, 800);

            } catch (error) {
                console.error('Error en login:', error);
                let errorMsg = error.message;

                if (errorMsg.includes('Invalid login credentials')) {
                    errorMsg = 'Correo o contraseña incorrectos';
                } else if (errorMsg.includes('Email not confirmed')) {
                    errorMsg = 'Debes confirmar tu correo electrónico. Revisa tu bandeja de entrada.';
                }

                showAlert('error', '❌ ' + errorMsg);
            } finally {
                setLoading(btnLoginSubmit, false);
            }
        });

        // =============================================
        // RECUPERACIÓN DE CONTRASEÑA
        // =============================================
        formRecovery.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlerts();

            setLoading(btnRecoverySubmit, true);

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(
                    recoveryEmail.value.trim(),
                    {
                        redirectTo: window.location.origin + '/login.html'
                    }
                );

                if (error) {
                    throw new Error(error.message);
                }

                showAlert('success', '✅ Se ha enviado un enlace de recuperación a tu correo. Revisa tu bandeja de entrada.');
                recoveryEmail.value = '';

            } catch (error) {
                console.error('Error en recuperación:', error);
                showAlert('error', '❌ ' + error.message);
            } finally {
                setLoading(btnRecoverySubmit, false);
            }
        });

        // =============================================
        // VERIFICAR SESIÓN EXISTENTE AL CARGAR
        // =============================================
        async function checkExistingSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (session && session.user) {
                const { data: profile } = await supabaseClient
                    .from('perfiles')
                    .select('rol, activo, suspendido')
                    .eq('user_id', session.user.id)
                    .single();

                if (profile && profile.activo && !profile.suspendido) {
                    switch (profile.rol) {
                        case 'admin':
                            window.location.href = 'admin.html';
                            break;
                        case 'repartidor':
                            window.location.href = 'repartidor.html';
                            break;
                        case 'cliente':
                        default:
                            window.location.href = 'cliente.html';
                            break;
                    }
                }
            }
        }

        checkExistingSession();

        console.log('🚀 PediFlash Login - Sistema listo');
        console.log('📋 Roles disponibles: cliente, repartidor, admin');
        console.log('🎁 Sistema de afiliados integrado');
        console.log('💡 El código se valida al escribir y se vincula después del registro');
    </script>
</body>
</html>
