<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PediFlash - Envíos Rápidos y Seguros</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --primary-light: #FFF5F0;
            --secondary: #1A1A2E;
            --accent: #1A936F;
            --danger: #DC3545;
            --warning: #FFC107;
            --dark: #212529;
            --gray: #6C757D;
            --light: #F8F9FA;
            --white: #FFFFFF;
            --radius: 20px;
            --radius-sm: 12px;
            --shadow: 0 10px 40px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #FFFBF8;
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ========== BOTÓN INSTALAR APP ========== */
        .install-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: white;
            border-radius: 25px;
            padding: 12px 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid var(--primary-light);
            max-width: 90%;
            white-space: nowrap;
        }

        .install-banner.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .install-banner-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #FF8C5A);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            animation: pulse-install 2s infinite;
        }

        @keyframes pulse-install {
            0% { box-shadow: 0 0 0 0 rgba(255,107,53,0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255,107,53,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,107,53,0); }
        }

        .install-banner-text {
            flex: 1;
            min-width: 0;
        }

        .install-banner-text strong {
            display: block;
            font-size: 14px;
            color: var(--secondary);
        }

        .install-banner-text small {
            font-size: 12px;
            color: var(--gray);
        }

        .install-banner-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
            font-family: inherit;
        }

        .install-banner-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .install-banner-close {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .install-banner-close:hover {
            transform: scale(1.1);
        }

        /* Botón flotante de instalar */
        .floating-install-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 9998;
            box-shadow: 0 8px 30px rgba(255,107,53,0.4);
            display: none;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            animation: float-install 3s ease-in-out infinite;
        }

        .floating-install-btn.show {
            display: flex;
        }

        @keyframes float-install {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .floating-install-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 40px rgba(255,107,53,0.5);
        }

        .floating-install-btn:active {
            transform: scale(0.95);
        }

        /* Tooltip para el botón flotante */
        .floating-install-btn::after {
            content: '¡Instalar App!';
            position: absolute;
            right: 70px;
            background: var(--secondary);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: var(--transition);
        }

        .floating-install-btn:hover::after {
            opacity: 1;
            right: 75px;
        }

        /* ========== NAVBAR ========== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 15px 0;
            transition: var(--transition);
            background: transparent;
        }

        .navbar.scrolled {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
            padding: 10px 0;
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-weight: 800;
            font-size: 24px;
            color: var(--white);
            transition: var(--transition);
        }

        .navbar.scrolled .logo {
            color: var(--secondary);
        }

        .logo-img {
            width: 42px;
            height: 42px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 15px rgba(255,107,53,0.3);
        }

        .logo-text span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            color: rgba(255,255,255,0.9);
            transition: var(--transition);
            position: relative;
        }

        .navbar.scrolled .nav-links a {
            color: var(--dark);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: var(--transition);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .btn-nav {
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 20px rgba(255,107,53,0.3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255,107,53,0.4);
        }

        .btn-outline-light {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
        }

        .navbar.scrolled .btn-outline-light {
            border-color: var(--primary);
            color: var(--primary);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--white);
            transition: var(--transition);
        }

        .navbar.scrolled .menu-toggle {
            color: var(--secondary);
        }

        /* Botón instalar en navbar */
        .btn-install-nav {
            background: var(--accent);
            color: white;
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-family: inherit;
            display: none;
            align-items: center;
            gap: 6px;
        }

        .btn-install-nav.show {
            display: flex;
        }

        .btn-install-nav:hover {
            background: #147a5c;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26,147,111,0.4);
        }

        /* ========== HERO ========== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            padding: 120px 0 80px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(255,107,53,0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(26,147,111,0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.05); }
        }

        .hero .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-content h1 {
            font-size: clamp(40px, 6vw, 64px);
            font-weight: 900;
            line-height: 1.1;
            color: white;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        .hero-content h1 .highlight {
            background: linear-gradient(135deg, var(--primary), #FF8C5A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-content p {
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 35px;
            max-width: 500px;
            line-height: 1.8;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .hero-buttons .btn {
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-hero-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 30px rgba(255,107,53,0.4);
            border: none;
        }

        .btn-hero-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255,107,53,0.5);
        }

        .btn-hero-secondary {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
        }

        .btn-hero-secondary:hover {
            background: rgba(255,255,255,0.1);
            border-color: white;
        }

        .btn-install-hero {
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 30px rgba(26,147,111,0.3);
        }

        .btn-install-hero.show {
            display: inline-flex;
        }

        .btn-install-hero:hover {
            background: #147a5c;
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(26,147,111,0.4);
        }

        .hero-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hero-phone {
            width: 280px;
            height: 560px;
            background: linear-gradient(145deg, #2d2d3f, #1a1a2e);
            border-radius: 40px;
            padding: 15px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }

        .hero-phone-screen {
            background: var(--primary-light);
            border-radius: 28px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
            font-size: 50px;
            overflow: hidden;
            position: relative;
        }

        .phone-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--accent);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(26,147,111,0.4); }
            70% { box-shadow: 0 0 0 20px rgba(26,147,111,0); }
            100% { box-shadow: 0 0 0 0 rgba(26,147,111,0); }
        }

        .floating-card {
            position: absolute;
            background: white;
            border-radius: 16px;
            padding: 15px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            font-size: 14px;
            font-weight: 600;
            z-index: 2;
            animation: floatCard 5s ease-in-out infinite;
        }

        .floating-card.top {
            top: 10%;
            right: -30px;
            animation-delay: 0s;
        }

        .floating-card.bottom {
            bottom: 15%;
            left: -20px;
            animation-delay: 2.5s;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* ========== STATS BAR ========== */
        .stats-bar {
            background: white;
            padding: 30px 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
            position: relative;
            z-index: 2;
            margin-top: -60px;
            border-radius: 30px 30px 0 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .stat-item {
            text-align: center;
            padding: 20px;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
        }

        .stat-label {
            font-size: 13px;
            color: var(--gray);
            margin-top: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ========== SECTIONS ========== */
        .section {
            padding: 100px 0;
        }

        .section .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 70px;
        }

        .section-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 13px;
            letter-s
