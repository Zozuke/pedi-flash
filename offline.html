<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PediFlash - Sin Conexión</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
        }
        .icon { font-size: 80px; margin-bottom: 20px; animation: bounce 1s infinite; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        h1 { font-size: 28px; margin-bottom: 15px; }
        p { color: rgba(255,255,255,0.7); margin-bottom: 25px; line-height: 1.6; }
        button {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { background: #E55A2B; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛵</div>
        <h1>¡Sin conexión!</h1>
        <p>
            Parece que no tienes internet en este momento.<br>
            PediFlash necesita conexión para procesar envíos en tiempo real.
        </p>
        <button onclick="location.reload()">
            🔄 Reintentar Conexión
        </button>
        <p style="margin-top:20px; font-size:14px;">
            <small>Verifica tu conexión WiFi o datos móviles</small>
        </p>
    </div>
    
    <script>
        // Verificar conexión periódicamente
        setInterval(() => {
            if (navigator.onLine) {
                location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
